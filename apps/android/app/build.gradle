plugins {
    id 'com.android.application'
}

android {
    namespace 'com.agg.reader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.agg.reader'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.1.10'
    }

    signingConfigs {
        // 自用固定 debug 证书：保证本地包和 CI 包可互相覆盖安装
        aggDebug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.aggDebug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}


